label { display:block; margin-top:10px; color:var(--muted); font-size:14px; }
#msg { min-height:1.4em; margin-top:10px; color:#a3242a; font-size:14px; }
iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
</style>

  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.i) }, key, b64(D.c));
  const fr = document.createElement('iframe');
  fr.srcdoc = new TextDecoder().decode(pt);
  document.body.replaceChildren(fr);
}
async function go(pass, remember) {
  msg.textContent = 'Unlocking…';
  try { await open(pass); if (remember) try { localStorage.setItem('dp', pass); } catch (e) {} }
  catch (e) { try { localStorage.removeItem('dp'); } catch (e2) {} msg.textContent = 'Wrong passphrase, or the data changed.'; }
}
document.getElementById('f').addEventListener('submit', (e) => { e.preventDefault(); go(document.getElementById('p').value, document.getElementById('r').checked); });
try { const s = localStorage.getItem('dp'); if (s) go(s, true); } catch (e) {}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
