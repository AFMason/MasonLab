<style>
:root { --bg:#f6f5f1; --ink:#1d2226; --muted:#5d666e; --line:#dcdad2; --accent:#1f5d7a; }

html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
#lock { min-height:100%; display:flex; align-items:center; justify-content:center; padding:16px; box-sizing:border-box; }
form { width:100%; max-width:340px; }
h1 { font-size:20px; margin:0 0 14px; }
input[type=password] { width:100%; box-sizing:border-box; font:inherit; padding:12px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; }
button { width:100%; margin-top:10px; font:inherit; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#fff; }
label { display:block; margin-top:10px; color:var(--muted); font-size:14px; }
#msg { min-height:1.4em; margin-top:10px; color:#a3242a; font-size:14px; }
iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
</style>
