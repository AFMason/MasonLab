<style>

label { display:block; margin-top:10px; color:var(--muted); font-size:14px; }
#msg { min-height:1.4em; margin-top:10px; color:#a3242a; font-size:14px; }
iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:var(--bg); }

const keys = {};
async function skey(salt, n) {
  const id = salt + n;

    const base = await crypto.subtle.importKey('raw', enc.encode(PASS), 'PBKDF2', false, ['deriveKey']);

// Done-marks sync through an encrypted state.json in a private GitHub repo. Marks: {key: {d, t, p}}; newest t wins.
window.GS = {
  cfg() { try { return JSON.parse(localStorage.getItem('gs')); } catch (e) { return null; } },
  setCfg(c) { try { if (c) localStorage.setItem('gs', JSON.stringify(c)); else localStorage.removeItem('gs'); } catch (e) {} },
  async sync() {
    const cfg = this.cfg();

    const api = 'https://api.github.com/repos/' + cfg.repo + '/contents/state.json';

async function open(pass) {
  PASS = pass;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
