#msg { min-height:1.4em; margin-top:10px; color:#a3242a; font-size:14px; }
iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:var(--bg); }

const keys = {};
async function skey(salt, n) {
  const id = salt + n;

  cfg() { try { return JSON.parse(localStorage.getItem('gs')); } catch (e) { return null; } },

async function open(pass) {
  PASS = pass;
