<title>Grants</title>
<style>
:root { --bg:#f6f5f1; --ink:#1d2226; --muted:#5d666e; --line:#dcdad2; --accent:#1f5d7a; }
@media (prefers-color-scheme: dark) { :root { --bg:#14181b; --ink:#e8e9e6; --muted:#9aa4ab; --line:#333c42; --accent:#7ab8d4; } }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
#lock { min-height:100%; display:flex; align-items:center; justify-content:center; padding:16px; box-sizing:border-box; }
form { width:100%; max-width:340px; }
h1 { font-size:20px; margin:0 0 14px; }
input[type=password] { width:100%; box-sizing:border-box; font:inherit; padding:12px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; }
button { width:100%; margin-top:10px; font:inherit; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#fff; }
label { display:block; margin-top:10px; color:var(--muted); font-size:14px; }
#msg { min-height:1.4em; margin-top:10px; color:#a3242a; font-size:14px; }
iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:var(--bg); }
</style>
</head>

<div id="lock"><form id="f"><h1>Grants dashboard</h1>

  },
};
async function open(pass) {
  PASS = pass;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(D.s), iterations: D.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.i) }, key, b64(D.c));
  const fr = document.createElement('iframe');
  fr.srcdoc = new TextDecoder().decode(pt);
  document.body.replaceChildren(fr);
}
async function go(pass, remember) {
  msg.textContent = 'Unlocking…';
  try { await open(pass); if (remember) try { localStorage.setItem('dp', pass); } catch (e) {} }
  catch (e) { try { localStorage.removeItem('dp'); } catch (e2) {} msg.textContent = 'Wrong passphrase, or the data changed.'; }
}
document.getElementById('f').addEventListener('submit', (e) => { e.preventDefault(); go(document.getElementById('p').value, document.getElementById('r').checked); });
try { const s = localStorage.getItem('dp'); if (s) go(s, true); } catch (e) {}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
